name: Clazy on PR
on: [pull_request]

jobs:
  clazy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.9.0 linux_gcc_64 -O "$HOME/Qt"
          echo "QT_ROOT_DIR=$HOME/Qt/6.9.0/gcc_64" >> "$GITHUB_ENV"

      - name: Install Clazy and other tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clazy cmake ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libegl1

      - name: Build project
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --target QuickStatus2_autogen

      - name: Run Clazy
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }} HEAD -- '*.cpp')
          echo "$FILES"
          [ -z "$FILES" ] && exit 0
          clazy-standalone -p build -checks=level1 $FILES